name: river-and-reed
region: nyc
static_sites:
  - name: river-map
    environment_slug: html
    git:
      repo_clone_url: https://github.com/zurgenfeldt/river-and-reed-deploy.git
      branch: main
    source_dir: /
    output_dir: public
    index_document: index.html
    error_document: 404.html
ingress:
  rules:
    - component:
        name: river-map
      match:
        path:
          prefix: /
